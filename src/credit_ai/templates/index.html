<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · 교실 경제 신용평가</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div>
          <p class="eyebrow">초등 교실 경제활동 시뮬레이션</p>
          <h1>교실신용</h1>
          <p class="lede">
            지출 추이, 숙제 완료율, 출결률로
            딥러닝 신용점수를 매깁니다.
          </p>
        </div>
        <dl class="status-strip">
          <div><dt>모드</dt><dd id="mode-pill">확인 중</dd></div>
          <div><dt>모델</dt><dd id="model-pill">확인 중</dd></div>
          <div><dt>학급</dt><dd>3-2</dd></div>
        </dl>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="roster" type="button">학급 명단</button>
        <button class="tab" data-tab="simulator" type="button">점수 시뮬레이터</button>
      </nav>

      <section id="panel-roster" class="panel is-active">
        <div class="layout">
          <article class="sheet">
            <div class="sheet-head">
              <h2>신용 순위</h2>
              <button id="rescore-btn" class="ghost" type="button">학급 다시 채점</button>
            </div>
            <p id="roster-status" class="hint">명단을 불러오는 중…</p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>순위</th>
                    <th>이름</th>
                    <th>직업</th>
                    <th>점수</th>
                    <th>등급</th>
                  </tr>
                </thead>
                <tbody id="roster-body"></tbody>
              </table>
            </div>
          </article>
          <aside class="dossier" id="dossier">
            <p class="empty">왼쪽에서 친구를 고르면 신용 리포트가 열려요.</p>
          </aside>
        </div>
      </section>

      <section id="panel-simulator" class="panel">
        <div class="layout">
          <article class="sheet">
            <h2>세 가지 습관 조절</h2>
            <p class="hint">슬라이더를 움직이면 딥러닝 모델이 즉시 다시 점수를 매깁니다.</p>
            <form id="sim-form" class="sliders">
              <label>
                <span>지출 추이 <em id="v-spending">0.30</em></span>
                <input name="spending_trend" type="range" min="0" max="1" step="0.01" value="0.30" />
                <small>낮을수록 알뜰</small>
              </label>
              <label>
                <span>숙제 완료율 <em id="v-homework">90%</em></span>
                <input name="homework_rate" type="range" min="0" max="1" step="0.01" value="0.90" />
                <small>숙제를 빠짐없이 끝내면 점수가 올라요</small>
              </label>
              <label>
                <span>출결률 <em id="v-attendance">96%</em></span>
                <input name="attendance_rate" type="range" min="0" max="1" step="0.01" value="0.96" />
                <small>꾸준히 등교하는 힘이 신뢰입니다</small>
              </label>
            </form>
          </article>
          <aside class="dossier" id="sim-result">
            <p class="empty">값을 바꾸면 이곳에 점수가 나타납니다.</p>
          </aside>
        </div>
      </section>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
