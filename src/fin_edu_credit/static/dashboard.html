<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>학급 신용 현황 · fin_edu</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel-2: #1e2739;
    --line: #2a3448;
    --text: #e8edf7;
    --muted: #97a3bb;
    --accent: #5b8cff;
    --good: #35c48c;
    --warn: #f0b429;
    --bad: #f2616b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: baseline;
    justify-content: space-between;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { padding: 20px 24px 64px; max-width: 1180px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 26px; font-weight: 650; margin-top: 6px; letter-spacing: -0.5px; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  section { margin-top: 28px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .row { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .g-good { background: rgba(53,196,140,.14); color: var(--good); }
  .g-mid  { background: rgba(240,180,41,.14); color: var(--warn); }
  .g-bad  { background: rgba(242,97,107,.15); color: var(--bad); }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .track { flex: 1; height: 7px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 999px; background: var(--accent); }
  select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .score-big { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .summary { color: var(--muted); font-size: 13px; margin: 12px 0 16px; }
  .reason { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .reason .advice { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .delta-minus { color: var(--bad); font-variant-numeric: tabular-nums; }
  .delta-plus { color: var(--good); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }
  .err { color: var(--bad); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .legend span { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>학급 신용 현황</h1>
    <div class="sub" id="meta">불러오는 중…</div>
  </div>
  <div>
    <select id="classFilter"><option value="">전체 학급</option></select>
    <button id="refresh">새로고침</button>
  </div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <section>
    <div class="row">
      <div class="panel">
        <h2>학생별 신용점수 <span id="listCount" class="sub"></span></h2>
        <div id="listWrap"><div class="empty">불러오는 중…</div></div>
      </div>
      <div class="panel" id="detailPanel">
        <h2>학생 상세</h2>
        <div class="empty">왼쪽 표에서 학생을 선택하세요.</div>
      </div>
    </div>
  </section>

  <section>
    <h2>등급 분포</h2>
    <div class="panel" id="dist"></div>
  </section>

  <section>
    <h2>반별 요약</h2>
    <div class="panel" id="classes"></div>
  </section>
</main>

<script>
const state = { items: [], selected: null, classes: [], grades: [] };

const gradeClass = (g) => (g <= 3 ? "g-good" : g <= 6 ? "g-mid" : "g-bad");
const fmt = (n) => Number(n).toLocaleString("ko-KR");

async function getJSON(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function renderCards(data) {
  const dist = data.grade_distribution || {};
  const total = data.count || 0;
  const risky = Object.entries(dist)
    .filter(([g]) => Number(g) >= 8)
    .reduce((sum, [, v]) => sum + v, 0);
  const best = state.items.length ? state.items[0] : null;
  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="k">평가 학생</div><div class="v">${fmt(total)}<small>명</small></div></div>
    <div class="card"><div class="k">평균 신용점수</div><div class="v">${fmt(data.average_score ?? 0)}<small>점</small></div></div>
    <div class="card"><div class="k">관리가 필요한 학생 (8~10등급)</div><div class="v">${fmt(risky)}<small>명</small></div></div>
    <div class="card"><div class="k">최고 점수</div><div class="v">${best ? fmt(best.score) : "-"}<small>${best ? best.name : ""}</small></div></div>
  `;
}

function renderList() {
  const wrap = document.getElementById("listWrap");
  if (!state.items.length) {
    wrap.innerHTML = '<div class="empty">평가된 학생이 없습니다. 먼저 seed → train → score 를 실행하세요.</div>';
    return;
  }
  const rows = state.items.map((it) => `
    <tr data-id="${it.member_id}">
      <td>${it.name}</td>
      <td>${it.class}</td>
      <td class="num">${fmt(it.score)}</td>
      <td><span class="pill ${gradeClass(it.grade)}">${it.grade}등급 ${it.grade_label}</span></td>
      <td class="num">${(it.pd * 100).toFixed(1)}%</td>
    </tr>`).join("");
  wrap.innerHTML = `<table>
      <thead><tr><th>이름</th><th>반</th><th class="num">신용점수</th><th>등급</th><th class="num">연체 확률</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  wrap.querySelectorAll("tbody tr").forEach((tr) =>
    tr.addEventListener("click", () => selectMember(Number(tr.dataset.id)))
  );
  document.getElementById("listCount").textContent = `(${state.items.length}명)`;
}

function renderDist(dist) {
  const entries = state.grades.map((g) => [g.grade, dist[g.grade] || 0, g.label]);
  const max = Math.max(1, ...entries.map((e) => e[1]));
  document.getElementById("dist").innerHTML = entries.map(([g, n, label]) => `
    <div class="bar" style="margin:7px 0">
      <span class="pill ${gradeClass(g)}" style="min-width:96px">${g}등급 ${label}</span>
      <div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div>
      <span style="width:44px;text-align:right;font-variant-numeric:tabular-nums">${n}명</span>
    </div>`).join("");
}

async function renderClasses() {
  const data = await getJSON("/api/classes");
  state.classes = data;
  const select = document.getElementById("classFilter");
  if (select.options.length === 1) {
    data.forEach((c) => select.add(new Option(c.class, c.class)));
  }
  document.getElementById("classes").innerHTML = `<table>
    <thead><tr><th>반</th><th class="num">학생</th><th class="num">평균 점수</th>
    <th class="num">최저</th><th class="num">최고</th><th class="num">평균 등급</th>
    <th class="num">관리 필요</th></tr></thead>
    <tbody>${data.map((c) => `<tr>
      <td>${c.class}</td><td class="num">${c.students}</td>
      <td class="num">${fmt(c.score_mean)}</td><td class="num">${fmt(c.score_min)}</td>
      <td class="num">${fmt(c.score_max)}</td><td class="num">${c.grade_mean}</td>
      <td class="num">${c.high_risk}</td></tr>`).join("")}</tbody></table>`;
}

async function selectMember(id) {
  const panel = document.getElementById("detailPanel");
  panel.innerHTML = '<h2>학생 상세</h2><div class="empty">불러오는 중…</div>';
  try {
    const d = await getJSON(`/api/members/${id}`);
    const minus = (d.reason.minus || []).map((r) => `
      <div class="reason"><div><div>${r.label}</div><div class="advice">${r.advice}</div></div>
      <div class="delta-minus">${r.points_delta.toFixed(0)}점</div></div>`).join("");
    const plus = (d.reason.plus || []).map((r) => `
      <div class="reason"><div>${r.label}</div>
      <div class="delta-plus">+${r.points_delta.toFixed(0)}점</div></div>`).join("");
    const comps = Object.entries(d.rule_components).map(([k, v]) => `
      <div class="bar" style="margin:6px 0">
        <span style="width:132px;font-size:12px;color:var(--muted)">${k}</span>
        <div class="track"><div class="fill" style="width:${Math.round(v * 100)}%"></div></div>
        <span style="width:40px;text-align:right;font-size:12px">${Math.round(v * 100)}%</span>
      </div>`).join("");
    panel.innerHTML = `
      <div class="detail-head">
        <div>
          <h2 style="margin-bottom:2px">${d.name} · ${d.class} · ${d.job}</h2>
          <div class="sub">평가 기준일 ${d.evaluated_at} · 규칙기반 점수 ${fmt(d.rule_score)}점</div>
        </div>
        <div style="text-align:right">
          <div class="score-big">${fmt(d.score)}</div>
          <span class="pill ${gradeClass(d.grade)}">${d.grade}등급 ${d.grade_label}</span>
        </div>
      </div>
      <p class="summary">${d.summary}</p>
      ${plus ? `<h2>잘하고 있는 점</h2>${plus}` : ""}
      ${minus ? `<h2 style="margin-top:16px">점수를 깎은 이유</h2>${minus}` : ""}
      <h2 style="margin-top:18px">생활 습관 항목별 달성도</h2>${comps}`;
  } catch (err) {
    panel.innerHTML = `<h2>학생 상세</h2><div class="err">불러오지 못했습니다: ${err.message}</div>`;
  }
}

async function load() {
  const cls = document.getElementById("classFilter").value;
  const meta = document.getElementById("meta");
  try {
    const [health, grades] = await Promise.all([getJSON("/api/health"), getJSON("/api/grades")]);
    state.grades = grades;
    const data = await getJSON(`/api/scores${cls ? `?class=${encodeURIComponent(cls)}` : ""}`);
    state.items = data.items;
    meta.textContent = `평가 기준일 ${data.evaluated_at ?? "-"} · 모델 ${health.model_version} · 사용 피처 ${health.features.length}개`;
    renderCards(data);
    renderList();
    renderDist(data.grade_distribution || {});
    await renderClasses();
  } catch (err) {
    meta.innerHTML = `<span class="err">데이터를 불러오지 못했습니다: ${err.message}. 먼저 seed → train → score 를 실행하세요.</span>`;
    document.getElementById("listWrap").innerHTML = '<div class="empty">데이터 없음</div>';
  }
}

document.getElementById("classFilter").addEventListener("change", load);
document.getElementById("refresh").addEventListener("click", async () => {
  await fetch("/api/refresh", { method: "POST" });
  load();
});
load();
</script>
</body>
</html>
