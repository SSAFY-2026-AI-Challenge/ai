[project]
name = "classroom-credit-ai"
version = "1.0.0"
description = "초등 교실 경제활동 시뮬레이션을 위한 딥러닝 신용점수 모델"
readme = "README.md"
authors = [{ name = "Bak" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "torch>=2.5",
    "google-cloud-secret-manager>=2.21",
]

[project.scripts]
credit-ai = "credit_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit_ai"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
