[project]
name = "fin-edu-credit"
version = "0.1.0"
description = "초등학교 모의 경제(fin_edu) 학급 신용평가 모델"
requires-python = ">=3.10"
dependencies = [
    "PyMySQL>=1.1.1",
    "cryptography>=42.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fin-edu-credit = "fin_edu_credit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
