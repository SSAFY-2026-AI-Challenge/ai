name: 작업
description: 구현, 조치, 설계, 문서, 학습 할 일을 등록합니다.
title: "[Task] "
type: Task
body:
  - type: markdown
    attributes:
      value: "설계, 구현, 문서 작업은 이 템플릿으로 등록합니다."
  - type: textarea
    id: goal
    attributes:
      label: 목표
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 이 작업이 필요한지 적어 주세요.
  - type: textarea
    id: checklist
    attributes:
      label: 작업 항목
      description: 체크리스트로 적어 주세요.
      value: |
        - [ ] 항목
        - [ ] 항목
        - [ ] 항목
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 높음
        - 보통
        - 낮음
    validations:
      required: true
