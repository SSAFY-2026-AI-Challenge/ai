name: 기능 제안
description: 새로운 기능이나 개선을 제안합니다.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 추가하거나 바꾸고 싶은 동작을 구체적으로 적어 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      placeholder: 예) 추천 결과가 늦고, 사용자가 이유를 이해하기 어렵습니다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 방법이 있으면 적어 주세요.
  - type: dropdown
    id: impact
    attributes:
      label: 기대 효과
      options:
        - 사용성 개선
        - 성능 개선
        - 보안/안정성
        - 문서/학습
        - 기타
    validations:
      required: true
