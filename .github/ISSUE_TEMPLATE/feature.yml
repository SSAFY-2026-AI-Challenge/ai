name: 기능 개발
description: 새로운 기능이나 개선을 제안합니다.
title: "[Feature] "
type: Feature
body:
  - type: markdown
    attributes:
      value: "추가하거나 바꾸고 싶은 동작을 구체적으로 적어 주세요."
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      placeholder: 예) 추천 결과가 늦고, 사용자가 이유를 이해하기 어렵습니다.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 상세 내용
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      description: 완료할 항목을 적어 주세요.
      value: |
        - [ ] 항목
        - [ ] 항목
        - [ ] 항목
  - type: textarea
    id: references
    attributes:
      label: 참고자료
      description: 관련 이슈, 문서, 링크를 적어 주세요.
