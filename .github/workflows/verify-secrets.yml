name: Verify Secret Manager

on:
  workflow_dispatch:

concurrency:
  group: credit-ai-sm-verify
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Show runner
        run: |
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "user=$(whoami) home=$HOME host=$(hostname)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy script
        run: bash -n deploy/gcp.sh

      - name: Probe Secret Manager
        run: bash deploy/gcp.sh verify-secrets

      - name: Report Secret Manager result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "4"
          JOB_STATUS: ${{ job.status }}
        run: |
          export PROBE_FILE="${HOME}/credit-ai/logs/secret-manager-probe.json"
          python3 deploy/report_secret_probe.py
