name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      train:
        description: 모델을 다시 학습합니다
        type: boolean
        default: false

concurrency:
  group: credit-ai-gcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy script
        run: bash -n deploy/gcp.sh

      - name: Deploy app
        env:
          FORCE_TRAIN: ${{ github.event.inputs.train || 'false' }}
        run: bash deploy/gcp.sh deploy
